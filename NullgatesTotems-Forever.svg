<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Totems - Forever: a carved totem with the four element colors -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a3c"/>
      <stop offset="0.5" stop-color="#7a4e28"/>
      <stop offset="1" stop-color="#4e2f16"/>
    </linearGradient>
    <radialGradient id="storm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f4e9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="262" r="190" fill="url(#storm)"/>

  <!-- element orbs around the totem -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="118" cy="168" r="30" fill="#ff7a2a"/>
    <circle cx="394" cy="168" r="30" fill="#5ab8ff"/>
    <circle cx="118" cy="352" r="30" fill="#b88a4a"/>
    <circle cx="394" cy="352" r="30" fill="#e6f2ff"/>
  </g>
  <circle cx="118" cy="168" r="22" fill="#ff8a3a" stroke="#ffd2a8" stroke-width="4"/>
  <path d="M118 152 q12 14 0 30 q-12 -16 0 -30 Z" fill="#ffe28a"/>
  <circle cx="394" cy="168" r="22" fill="#3a9aec" stroke="#cfeaff" stroke-width="4"/>
  <path d="M394 154 q11 14 0 26 q-11 -12 0 -26 Z" fill="#cfeaff"/>
  <circle cx="118" cy="352" r="22" fill="#9a6a34" stroke="#e8cfa0" stroke-width="4"/>
  <path d="M106 360 l8 -16 l6 8 l6 -6 l6 14 Z" fill="#e8cfa0"/>
  <circle cx="394" cy="352" r="22" fill="#b8d4ec" stroke="#ffffff" stroke-width="4"/>
  <path d="M382 348 q12 -8 24 0 M384 358 q10 -6 20 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- totem pole -->
  <ellipse cx="256" cy="430" rx="80" ry="12" fill="#000000" opacity="0.35"/>
  <rect x="206" y="96" width="100" height="330" rx="14" fill="#7a4e28" opacity="0.5" filter="url(#glow)"/>
  <rect x="206" y="96" width="100" height="330" rx="14" fill="url(#wood)" stroke="#2e1a0a" stroke-width="5"/>
  <!-- wings on top -->
  <path d="M206 128 L150 104 L168 142 L206 150 Z" fill="#c9a54e" stroke="#5e4614" stroke-width="4" stroke-linejoin="round"/>
  <path d="M306 128 L362 104 L344 142 L306 150 Z" fill="#c9a54e" stroke="#5e4614" stroke-width="4" stroke-linejoin="round"/>
  <!-- carved faces -->
  <g stroke="#2e1a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 196 H306 M206 290 H306" fill="none"/>
    <rect x="226" y="128" width="20" height="14" rx="3" fill="#ffd27a"/>
    <rect x="266" y="128" width="20" height="14" rx="3" fill="#ffd27a"/>
    <path d="M232 168 Q256 184 280 168" fill="none"/>
    <circle cx="236" cy="226" r="9" fill="#9fe2ff"/>
    <circle cx="276" cy="226" r="9" fill="#9fe2ff"/>
    <path d="M230 256 H282 L274 272 H238 Z" fill="#3e2410"/>
    <path d="M226 320 L246 332 M286 320 L266 332" fill="none"/>
    <path d="M236 362 Q256 350 276 362 Q256 384 236 362 Z" fill="#3e2410"/>
  </g>
  <path d="M220 110 V410" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>

  <!-- lightning sparkle -->
  <path d="M256 54 l-14 30 h12 l-8 24 l22 -32 h-12 l8 -22 Z" fill="#cfeaff"/>
</svg>
